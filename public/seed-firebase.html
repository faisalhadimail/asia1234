    function log(message) {
      const logEl = document.getElementById('log');
      logEl.textContent += message + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function seedData() {
      const btn = document.getElementById('seedBtn');
      btn.disabled = true;
      log('🔥 Starting Firebase seeding...\n');

      try {
        // Property Types
        log('📝 Migrating Property Types...');
        for (const pt of dummyData.propertyTypes) {
          await db.collection('propertyTypes').add(pt);
        }
        log(`✅ ${dummyData.propertyTypes.length} Property Types migrated\n`);

        // Locations
        log('📍 Migrating Locations...');
        for (const loc of dummyData.locations) {
          await db.collection('locations').add(loc);
        }
        log(`✅ ${dummyData.locations.length} Locations migrated\n`);

        // Promos
        log('🎁 Migrating Promos...');
        for (const promo of dummyData.promos) {
          const docRef = await db.collection('promos').add(promo);
          promo.id = docRef.id;
        }
        log(`✅ ${dummyData.promos.length} Promos migrated\n`);

        // Agents
        log('👥 Migrating Agents...');
        for (const agent of dummyData.agents) {
          await db.collection('agents').add(agent);
        }
        log(`✅ ${dummyData.agents.length} Agents migrated\n`);

        // Properties
        log('🏢 Migrating Properties...');
        for (const prop of dummyData.properties) {
          await db.collection('properties').add(prop);
        }
        log(`✅ ${dummyData.properties.length} Properties migrated\n`);

        // Visitors
        log('📋 Migrating Visitors...');
        for (const visitor of dummyData.visitors) {
          await db.collection('visitors').add(visitor);
        }
        log(`✅ ${dummyData.visitors.length} Visitors migrated\n`);

        // Admin Users
        log('🔐 Migrating Admin Users...');
        for (const user of dummyData.adminUsers) {
          await db.collection('adminUsers').add(user);
        }
        log(`✅ ${dummyData.adminUsers.length} Admin Users migrated\n`);

        // Articles
        log('📰 Migrating Articles...');
        for (const article of dummyData.articles) {
          await db.collection('articles').add(article);
        }
        log(`✅ ${dummyData.articles.length} Articles migrated\n`);

        // Reviews
        log('⭐ Migrating Reviews...');
        for (const review of dummyData.reviews) {
          await db.collection('reviews').add(review);
        }
        log(`✅ ${dummyData.reviews.length} Reviews migrated\n`);

        // Agency
        log('🏢 Migrating Agency...');
        await db.collection('agency').doc('default').set(dummyData.agency);
        log('✅ Agency migrated\n');

        // SEO
        log('🔍 Migrating SEO...');
        await db.collection('seo').doc('default').set(dummyData.seo);
        log('✅ SEO migrated\n');

        log('\n🎉 All data migrated successfully to Firebase!');
        log('\n📊 Summary:');
        log(`   - Property Types: ${dummyData.propertyTypes.length}`);
        log(`   - Locations: ${dummyData.locations.length}`);
        log(`   - Promos: ${dummyData.promos.length}`);
        log(`   - Agents: ${dummyData.agents.length}`);
        log(`   - Properties: ${dummyData.properties.length}`);
        log(`   - Visitors: ${dummyData.visitors.length}`);
        log(`   - Admin Users: ${dummyData.adminUsers.length}`);
        log(`   - Articles: ${dummyData.articles.length}`);
        log(`   - Reviews: ${dummyData.reviews.length}`);
        log('\n🔐 Login Admin:');

        log('   Password: admin123');

      } catch (error) {
        log('\n❌ Error during migration:');
        log(error.message);
        console.error(error);
      }

      btn.disabled = false;
    }
